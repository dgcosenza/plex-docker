services:
  plex:
    image: dgcosenza/plex:latest
    container_name: plex
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: host
    environment:
      - TZ=UTC
      - PLEX_UID=1000
      - PLEX_GID=1000
      - CHANGE_CONFIG_DIR_OWNERSHIP=true
      - VERSION=public
    volumes:
      - ./config:/config/Library/Application Support/Plex Media Server
      - ./tmp:/tmp
      - ./media:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 2048M
